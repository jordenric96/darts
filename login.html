<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speler Login</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .login-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 25px; margin-top: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--c-cyan); font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
        
        select, input[type="number"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; font-family: inherit; font-size: 1rem; }
        
        /* Speciale styling voor de PIN invoer */
        input[type="number"] { text-align: center; font-size: 2rem; letter-spacing: 10px; font-weight: bold; color: var(--c-yellow); }
        
        .btn-login { background: var(--c-cyan); color: black; font-weight: bold; padding: 15px; border-radius: 10px; width: 100%; text-transform: uppercase; border: none; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
        
        /* Verberg de extra velden initieel */
        #group-player, #group-pin, #btn-login { display: none; }
    </style>
</head>
<body>

    <header class="top-header">
        <button class="btn-back" id="btn-back-hub">⬅</button>
        <h2 style="color: white; font-size: 1.2rem;">Koppel je Pasje</h2>
    </header>

    <main style="padding-top: 10px;">
        
        <div class="login-card">
            <p style="color: #aaa; font-size: 0.9rem; margin-top: 0; margin-bottom: 25px; text-align: center;">
                Selecteer je gegevens en geef de unieke code van je ploegkapitein in om scores te mogen invoeren.
            </p>
            
            <div class="form-group">
                <label>1. Wat is jouw ploeg?</label>
                <select id="select-team" onchange="laadSpelers()">
                    <option value="">Laden...</option>
                </select>
            </div>

            <!-- Verschijnt pas als er een ploeg is gekozen -->
            <div class="form-group" id="group-player">
                <label>2. Wie ben jij?</label>
                <select id="select-player">
                    <option value="">Kies je naam...</option>
                </select>
            </div>

            <div class="form-group" id="group-pin">
                <label>3. Ploeg PIN-code</label>
                <input type="number" id="inp-pin" placeholder="----" inputmode="numeric" pattern="[0-9]*">
            </div>

            <p id="msg-box" style="display: none; font-weight: bold; text-align: center; padding: 10px; border-radius: 8px;"></p>

            <button class="btn-login" id="btn-login" onclick="login()">Inloggen 🔒</button>
        </div>

    </main>

    <script src="js/supabase.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
