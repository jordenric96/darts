<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nieuwe Competitie</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .form-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .form-card h3 { margin-top: 0; color: var(--c-cyan); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; font-size: 1rem; }
        
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn-submit { background: var(--c-cyan); color: black; font-weight: bold; padding: 15px; border-radius: 10px; width: 100%; text-transform: uppercase; border: none; font-size: 1.1rem; cursor: pointer; margin-top: 10px; margin-bottom: 30px; }
    </style>
</head>
<body>

    <header class="top-header">
        <button class="btn-back" onclick="window.location.href='index.html'">⬅</button>
        <h2 style="color: white; font-size: 1.2rem;">Competitie Opstarten</h2>
    </header>

    <main style="padding-top: 10px;">
        
        <div class="form-card">
            <h3>1. Basisgegevens</h3>
            <div class="form-group">
                <label>Naam van de competitie</label>
                <input type="text" id="inp-naam" placeholder="Bv. Zomerliga 2026 of Dartsliga">
            </div>
        </div>

        <div class="form-card">
            <h3>2. Puntentelling (Klassement)</h3>
            <div class="grid-3">
                <div class="form-group">
                    <label>Winst</label>
                    <input type="number" id="inp-pts-win" value="2">
                </div>
                <div class="form-group">
                    <label>Gelijk</label>
                    <input type="number" id="inp-pts-draw" value="1">
                </div>
                <div class="form-group">
                    <label>Verlies</label>
                    <input type="number" id="inp-pts-loss" value="0">
                </div>
            </div>
        </div>

        <div class="form-card" style="border-left: 4px solid var(--c-pink);">
            <h3 style="color: var(--c-pink);">3. Speler Statistieken</h3>
            <p style="font-size: 0.85rem; color: #888; margin-top: 0;">Wat zijn de standaard limieten voor de persoonlijke statistieken in deze competitie?</p>
            
            <div class="grid-2">
                <div class="form-group">
                    <label>High Finish (Vanaf)</label>
                    <input type="number" id="inp-hf" value="100">
                </div>
                <div class="form-group">
                    <label>Short Leg (Onder)</label>
                    <input type="number" id="inp-sl" value="20">
                </div>
            </div>
        </div>

        <p id="msg-box" style="display: none; font-weight: bold; text-align: center; padding: 10px; border-radius: 8px;"></p>

        <button class="btn-submit" id="btn-submit" onclick="maakCompetitieAan()">Competitie Aanmaken 🚀</button>

    </main>

    <script src="js/supabase.js"></script>
    <script src="js/maak-competitie.js"></script>
</body>
</html>
