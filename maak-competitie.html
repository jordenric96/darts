<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nieuwe Competitie</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .form-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .form-card h3 { margin-top: 0; color: var(--c-cyan); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; font-size: 1.1rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; font-size: 1rem; font-family: inherit; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        
        /* Checkboxes voor dagen */
        .days-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
        .days-grid label { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); color: white; text-transform: none; font-size: 0.9rem; }
        .days-grid input { accent-color: var(--c-cyan); width: 16px; height: 16px; }

        /* Dynamische contact rijen */
        .contact-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.2); margin-bottom: 10px; }
        .btn-add { background: transparent; border: 1px dashed var(--c-pink); color: var(--c-pink); padding: 10px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; color: white; font-size: 1rem; margin-top: 10px; }
        .checkbox-group input { width: 20px; height: 20px; accent-color: var(--c-cyan); }
        .btn-submit { background: var(--c-cyan); color: black; font-weight: bold; padding: 15px; border-radius: 10px; width: 100%; text-transform: uppercase; border: none; font-size: 1.1rem; cursor: pointer; margin-top: 10px; margin-bottom: 40px; }
    </style>
</head>
<body>

    <header class="top-header">
        <button class="btn-back" onclick="window.location.href='index.html'">⬅</button>
        <h2 style="color: white; font-size: 1.2rem;">Competitie Opstarten</h2>
    </header>

    <main style="padding-top: 10px;">
        
        <!-- BLOK 1: Basisgegevens -->
        <div class="form-card">
            <h3>🏷️ 1. Basisgegevens</h3>
            <div class="form-group">
                <label>Naam competitie *</label>
                <input type="text" id="inp-naam" placeholder="Bv. Dartsliga Pajottenland">
            </div>
            <div class="form-group">
                <label>Logo (URL)</label>
                <input type="text" id="inp-logo" placeholder="Bv. https://link-naar-logo.jpg">
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Seizoen</label><input type="text" id="inp-seizoen" placeholder="Bv. 2026-2027"></div>
                <div class="form-group">
                    <label>Aantal Reeksen/Divisies</label>
                    <input type="number" id="inp-reeksen" value="1" min="1">
                </div>
            </div>
        </div>

        <!-- BLOK 2: Praktisch -->
        <div class="form-card">
            <h3>📅 2. Praktische Info</h3>
            <div class="form-group">
                <label>Speeldagen (Meerdere mogelijk)</label>
                <div class="days-grid">
                    <label><input type="checkbox" class="cb-day" value="Maandag"> Ma</label>
                    <label><input type="checkbox" class="cb-day" value="Dinsdag"> Di</label>
                    <label><input type="checkbox" class="cb-day" value="Woensdag"> Wo</label>
                    <label><input type="checkbox" class="cb-day" value="Donderdag"> Do</label>
                    <label><input type="checkbox" class="cb-day" value="Vrijdag"> Vr</label>
                    <label><input type="checkbox" class="cb-day" value="Zaterdag"> Za</label>
                    <label><input type="checkbox" class="cb-day" value="Zondag"> Zo</label>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Startuur Matchen</label><input type="text" id="inp-uur" placeholder="Bv. 20:00"></div>
                <div class="form-group"><label>Inschrijvingsgeld (€)</label><input type="number" id="inp-geld" placeholder="Bv. 50"></div>
            </div>
        </div>

        <!-- BLOK 3: Opbouw Wedstrijd (Dynamisch) -->
        <div class="form-card">
            <h3>🎯 3. Structuur Wedstrijdblad</h3>
            <div class="form-group">
                <label>Speltype</label>
                <select id="inp-format"><option value="501">501 Double Out</option><option value="301">301 Double Out</option><option value="tactics">Tactics</option></select>
            </div>
            
            <div class="form-group" style="margin-top: 20px;">
                <label>Hoeveel individuele matchen worden er gegooid?</label>
                <input type="number" id="inp-total-matches" value="8" min="1" max="20" onchange="genereerMatchStructuur()">
            </div>
            
            <div id="match-structure-container" class="grid-2">
                <!-- Wordt via JS gevuld -->
            </div>

            <div class="checkbox-group" style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                <input type="checkbox" id="inp-teamgame"> 
                <label for="inp-teamgame" style="margin: 0; text-transform: none; color: white;">Wordt er afgesloten met een gezamenlijke Teamgame?</label>
            </div>
        </div>

        <!-- BLOK 4: Bestuur & Contacten -->
        <div class="form-card">
            <h3>📞 4. Contactpersonen Bestuur</h3>
            <div id="contacts-container">
                <div class="contact-row">
                    <input type="text" class="c-naam" placeholder="Naam">
                    <input type="text" class="c-rol" placeholder="Functie (Bv. Voorzitter)">
                    <input type="text" class="c-tel" placeholder="Gsm">
                    <input type="text" class="c-email" placeholder="E-mailadres">
                </div>
            </div>
            <button class="btn-add" onclick="voegContactToe()">+ Extra Contactpersoon Toevoegen</button>
        </div>

        <!-- BLOK 5: Reglement & Punten -->
        <div class="form-card" style="border-left: 4px solid var(--c-pink);">
            <h3 style="color: var(--c-pink);">📊 5. Reglement & Punten</h3>
            <div class="grid-3">
                <div class="form-group"><label>Winst</label><input type="number" id="inp-pts-win" value="2"></div>
                <div class="form-group"><label>Gelijk</label><input type="number" id="inp-pts-draw" value="1"></div>
                <div class="form-group"><label>Verlies</label><input type="number" id="inp-pts-loss" value="0"></div>
            </div>
            <p style="font-size: 0.8rem; color: #888;">Persoonlijke statistieken noteren (voor elke reeks):</p>
            <div class="grid-2">
                <div class="form-group"><label>High Finish (&gt;)</label><input type="number" id="inp-hf" value="100"></div>
                <div class="form-group"><label>Short Leg (&lt; pijlen)</label><input type="number" id="inp-sl" value="20"></div>
            </div>
        </div>

        <p id="msg-box" style="display: none; font-weight: bold; text-align: center; padding: 10px; border-radius: 8px;"></p>
        <button class="btn-submit" id="btn-submit" onclick="maakCompetitieAan()">Competitie Oprichten 🚀</button>

    </main>

    <script src="js/supabase.js"></script>
    <script src="js/maak-competitie.js"></script>
</body>
</html>
