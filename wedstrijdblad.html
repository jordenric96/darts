<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedstrijdblad</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .score-box { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .score-box input { width: 60px; height: 60px; text-align: center; font-size: 2rem; font-weight: bold; background: var(--c-cyan); color: black; border: none; border-radius: 10px; }
        .team-name { font-size: 1.2rem; font-weight: bold; color: white; flex: 1; text-align: center; }
        
        .stat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .stat-card h4 { margin: 0 0 15px 0; color: var(--c-pink); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        
        .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .stat-row label { font-size: 0.75rem; color: #aaa; text-transform: uppercase; }
        .stat-row input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; }
        
        /* Speciale styling voor privé veld */
        .private-field { background: rgba(236, 72, 153, 0.1); border: 1px solid var(--c-pink); border-radius: 6px; padding: 10px; margin-top: 10px; }
        .private-field label { color: var(--c-pink); font-weight: bold; }
        
        .btn-submit { background: var(--c-yellow); color: black; font-weight: bold; padding: 15px; border-radius: 10px; width: 100%; text-transform: uppercase; border: none; font-size: 1.1rem; cursor: pointer; margin-top: 20px; margin-bottom: 30px;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="top-header">
        <button class="btn-back" id="btn-back">⬅</button>
        <h2 style="color: white; font-size: 1.2rem;">Wedstrijdblad</h2>
    </header>

    <main style="padding-top: 15px;">
        <!-- Eindscore -->
        <h3 style="color: white; text-align: center;">Einduitslag</h3>
        <div class="score-box">
            <div class="team-name" id="name-home">Thuis</div>
            <input type="number" id="score-home" min="0">
            <span style="color: white; font-weight: bold; font-size: 1.5rem; margin: 0 15px;">-</span>
            <input type="number" id="score-away" min="0">
            <div class="team-name" id="name-away">Uit</div>
        </div>

        <!-- Uitleg over de limieten van deze divisie -->
        <div style="background: rgba(255, 235, 59, 0.1); border-left: 4px solid var(--c-yellow); padding: 10px; margin-bottom: 20px; font-size: 0.85rem; color: #ddd; border-radius: 8px;">
            <strong>Regels in deze reeks:</strong><br>
            Short Legs: &lt; <span id="lbl-sl">...</span> pijlen<br>
            High Finishes: &gt; <span id="lbl-hf">...</span> score
        </div>

        <!-- Speler Stats Thuisploeg -->
        <h3 style="color: white; border-bottom: 2px solid var(--c-cyan); padding-bottom: 5px;">Thuisploeg Stats</h3>
        <div id="stats-home">Laden...</div>

        <!-- Speler Stats Uitploeg -->
        <h3 style="color: white; border-bottom: 2px solid var(--c-cyan); padding-bottom: 5px; margin-top: 30px;">Uitploeg Stats</h3>
        <div id="stats-away">Laden...</div>

        <button class="btn-submit" onclick="dienScoreIn()">Bevestig Wedstrijdblad ✅</button>
    </main>

    <script src="js/wedstrijdblad.js"></script>
</body>
</html>
