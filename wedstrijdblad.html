<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedstrijdblad</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Totaalscore Blok (Bovenaan) */
        .total-score-card { background: rgba(0,0,0,0.6); border: 1px solid var(--c-cyan); border-radius: 12px; padding: 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; position: sticky; top: 10px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .team-name { font-weight: bold; font-size: 1.2rem; color: white; flex: 1; text-align: center; }
        .total-score { font-size: 3rem; font-weight: bold; color: var(--c-cyan); padding: 0 20px; }

        /* Individuele Wedstrijd Rijen */
        .match-row { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .match-header { font-size: 0.8rem; color: var(--c-pink); text-transform: uppercase; font-weight: bold; margin-bottom: 10px; text-align: center; letter-spacing: 1px; }
        .match-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: center; }
        
        /* Selectie & Invoer velden */
        select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; font-family: inherit; margin-bottom: 5px; font-size: 0.9rem; }
        .leg-score-input { width: 45px; height: 45px; text-align: center; font-size: 1.5rem; font-weight: bold; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: white; }
        .leg-score-input:focus { background: var(--c-cyan); color: black; outline: none; }

        /* Statistieken Blok (Onderaan) */
        .stats-section { margin-top: 40px; border-top: 2px dashed rgba(255,255,255,0.2); padding-top: 20px; }
        .stat-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .stat-card h4 { margin: 0 0 10px 0; color: white; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .stat-grid-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .stat-grid-inputs input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; text-align: center; }
        
        .private-avg { background: rgba(236, 72, 153, 0.15); border: 1px solid var(--c-pink); border-radius: 8px; padding: 10px; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; }
        .private-avg label { color: var(--c-pink); font-weight: bold; font-size: 0.85rem; }

        .btn-submit { background: var(--c-yellow); color: black; font-weight: bold; padding: 15px; border-radius: 10px; width: 100%; text-transform: uppercase; border: none; font-size: 1.1rem; cursor: pointer; margin-top: 20px; margin-bottom: 40px; box-shadow: 0 4px 10px rgba(255, 235, 59, 0.3); }
    </style>
</head>
<body>
    <header class="top-header">
        <button class="btn-back" onclick="window.history.back()">⬅</button>
        <h2 style="color: white; font-size: 1.2rem;">Wedstrijdblad</h2>
    </header>

    <main style="padding-top: 10px;">
        
        <!-- BEREKENDE EINDSTAND -->
        <div class="total-score-card">
            <div class="team-name" id="thuis-naam">Laden...</div>
            <div class="total-score" id="lbl-total-score">0 - 0</div>
            <div class="team-name" id="uit-naam">Laden...</div>
        </div>

        <p style="text-align: center; font-size: 0.85rem; color: #888; margin-bottom: 20px;">
            Vul de gewonnen legs per match in. De app berekent zelf de eindstand.
        </p>

        <!-- HIER KOMEN DE DYNAMISCHE MATCHEN (Solo/Dubbel) -->
        <div id="sub-matches-container">
            <p style="text-align: center; color: #aaa;">Wedstrijdstructuur ophalen...</p>
        </div>

        <!-- STATISTIEKEN BLOK -->
        <div class="stats-section">
            <h3 style="color: var(--c-cyan); text-transform: uppercase;">📊 Uitzonderlijke Prestaties</h3>
            <p style="font-size: 0.8rem; color: #aaa;">Reglement: High Finish vanaf <span id="reg-hf">..</span> | Short leg onder <span id="reg-sl">..</span> pijlen.</p>
            
            <div id="stats-container-thuis"></div>
            <div id="stats-container-uit"></div>
        </div>

        <button class="btn-submit" onclick="indienenWedstrijd()">Uitslag Indienen 🔒</button>

    </main>

    <script src="js/supabase.js"></script>
    <script src="js/wedstrijdblad.js"></script>
</body>
</html>
