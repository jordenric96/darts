<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedstrijdblad</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .score-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .team-name { font-weight: bold; font-size: 1.1rem; color: white; flex: 1; text-align: center; }
        .score-card input { width: 70px; height: 70px; text-align: center; font-size: 2.5rem; font-weight: bold; border-radius: 10px; border: none; background: var(--c-cyan); color: black; }
        
        .rules-badge { background: rgba(255, 235, 59, 0.1); border-left: 4px solid var(--c-yellow); padding: 10px; border-radius: 8px; color: #ddd; font-size: 0.85rem; margin-bottom: 25px; }
        
        .player-stat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .player-stat-card h4 { margin: 0 0 12px 0; color: white; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .stat-grid label { font-size: 0.75rem; color: #aaa; text-transform: uppercase; }
        .stat-grid input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; }
        
        /* Privé veld styling */
        .private-field { background: rgba(236, 72, 153, 0.1); border: 1px solid var(--c-pink); border-radius: 8px; padding: 12px; margin-top: 10px; display: flex; flex-direction: column; }
        .private-field label { color: var(--c-pink); font-weight: bold; }
        
        .section-title { color: var(--c-cyan); font-size: 1.1rem; text-transform: uppercase; margin-top: 30px; margin-bottom: 10px; border-bottom: 2px solid var(--c-cyan); padding-bottom: 5px; }
        .btn-submit { background: var(--c-yellow); color: black; font-weight: bold; padding: 15px; border-radius: 10px; width: 100%; text-transform: uppercase; border: none; font-size: 1.1rem; cursor: pointer; margin-top: 20px; margin-bottom: 40px; }
    </style>
</head>
<body>
    <header class="top-header">
        <button class="btn-back" id="btn-back">⬅</button>
        <h2 style="color: white; font-size: 1.2rem;">Wedstrijdblad</h2>
    </header>

    <main style="padding-top: 10px;">
        
        <div class="score-card">
            <div class="team-name" id="thuis-naam">Thuisploeg</div>
            <input type="number" id="thuis-score" min="0" placeholder="-">
            <span style="font-size: 2rem; color: white; font-weight: bold; margin: 0 10px;">:</span>
            <input type="number" id="uit-score" min="0" placeholder="-">
            <div class="team-name" id="uit-naam">Uitploeg</div>
        </div>

        <div class="rules-badge">
            <strong>Instellingen competitie:</strong><br>
            Short Legs noteren onder <strong id="lbl-sl">..</strong> pijlen.<br>
            High Finishes noteren vanaf <strong id="lbl-hf">..</strong> punten.
        </div>

        <h3 class="section-title">Thuisploeg Stats</h3>
        <div id="stats-thuis">Laden...</div>

        <h3 class="section-title">Uitploeg Stats</h3>
        <div id="stats-uit">Laden...</div>

        <button class="btn-submit" onclick="indienen()">Indienen (Vierogenprincipe) 🔒</button>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/wedstrijdblad.js"></script>
</body>
</html>
