<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beheerders Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-badge { background: var(--c-pink); color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; display: inline-block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <header class="top-header">
        <button class="btn-back" onclick="window.location.href='index.html'">⬅</button>
        <div>
            <div class="admin-badge">Admin Paneel</div>
            <h2 id="comp-titel" style="color: var(--c-yellow); margin: 0; font-size: 1.1rem;">Laden...</h2>
        </div>
    </header>

    <main>
        <div class="menu-grid" id="menu-grid" style="display: none;">
            <a href="#" id="link-instellingen" class="menu-block" style="border-color: #888;">
                <span class="menu-icon">⚙️</span>
                <span class="menu-text">Instellingen</span>
            </a>
            <a href="#" id="link-ploegen" class="menu-block">
                <span class="menu-icon">🛡️</span>
                <span class="menu-text">Ploegen beheren</span>
            </a>
            <a href="#" id="link-spelers" class="menu-block">
                <span class="menu-icon">👤</span>
                <span class="menu-text">Spelers (Rosters)</span>
            </a>
            <a href="#" id="link-kalender" class="menu-block" style="border-color: var(--c-cyan);">
                <span class="menu-icon">📅</span>
                <span class="menu-text">Kalender & Matchen</span>
            </a>
        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/beheer-hub.js"></script>
</body>
</html>
