<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Competitie Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .menu-grid { display: grid; gap: 15px; margin-top: 20px; }
        .btn-menu { background: var(--c-cyan); color: black; font-weight: bold; padding: 20px; border-radius: 12px; font-size: 1.1rem; text-transform: uppercase; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-login-speler { background: var(--c-pink); color: white; }
        
        /* Het digitale pasje voor ingelogde spelers */
        .player-badge { background: rgba(236, 72, 153, 0.15); border: 2px solid var(--c-pink); border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: center; display: none; }
        .player-badge-title { font-size: 0.75rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .player-badge-name { font-size: 1.3rem; font-weight: bold; color: var(--c-pink); margin: 0; }
        .player-badge-team { font-size: 0.9rem; color: white; margin-top: 2px; }
        .btn-logout { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; font-size: 0.75rem; padding: 5px 10px; border-radius: 5px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <header class="top-header">
        <button class="btn-back" onclick="window.location.href='index.html'">⬅</button>
        <h2 style="color: white; font-size: 1.2rem;" id="comp-title">Laden...</h2>
    </header>

    <main style="padding-top: 15px;">
        
        <!-- DIT IS HET DIGITALE PASJE (Verborgen als je niet bent ingelogd) -->
        <div class="player-badge" id="player-badge">
            <div class="player-badge-title">Digitaal Spelerspasje</div>
            <div class="player-badge-name" id="badge-name">Naam</div>
            <div class="player-badge-team" id="badge-team">Ploeg</div>
            <button class="btn-logout" onclick="uitloggen()">Uitloggen</button>
        </div>

        <div class="menu-grid">
            <!-- LOGIN KNOP (Verdwijnt als je al bent ingelogd) -->
            <button class="btn-menu btn-login-speler" id="btn-login-knop" onclick="gaNaarLogin()">
                👤 Inloggen als Speler
            </button>

            <!-- PUBLIEKE KNOPPEN -->
            <button class="btn-menu" onclick="gaNaar('kalender.html')">
                📅 Match Center
            </button>
            <button class="btn-menu" style="background: rgba(255,255,255,0.1); color: white;" onclick="alert('Klassement komt eraan!')">
                🏆 Klassement
            </button>
        </div>

    </main>

    <script src="js/supabase.js"></script>
    <script src="js/competitie.js"></script>
</body>
</html>
