<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalender Genereren</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--c-cyan); font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
        input[type="date"], input[type="number"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; font-family: inherit; font-size: 1rem; }
        .btn-add { background: var(--c-cyan); color: black; font-weight: bold; padding: 15px; border-radius: 10px; width: 100%; text-transform: uppercase; margin-top: 10px; cursor: pointer; border: none; font-size: 1rem; }
        .info-box { background: rgba(255, 235, 59, 0.1); border-left: 4px solid var(--c-yellow); padding: 15px; font-size: 0.85rem; color: #ddd; margin-bottom: 20px; }
    </style>
</head>
<body>
    <header class="top-header">
        <button class="btn-back" id="btn-back-hub">⬅</button>
        <h2 style="color: white; font-size: 1.2rem;">Kalender Motor</h2>
    </header>

    <main style="padding-top: 10px;">
        <div class="info-box">
            <strong>Automatische Planning</strong><br>
            De motor berekent een heen- en terugronde voor elke reeks. Ploegen spelen gegarandeerd 1x thuis en 1x uit tegen elke tegenstander. Bij een oneven aantal ploegen is er automatisch één ploeg "vrij".
        </div>

        <div class="admin-card">
            <h3 style="margin-top: 0; color: var(--c-cyan);">Instellingen</h3>
            
            <div class="form-group">
                <label>Startdatum eerste speeldag</label>
                <input type="date" id="inp-startdatum" required>
            </div>

            <div class="form-group">
                <label>Weken tussen speeldagen</label>
                <input type="number" id="inp-interval" value="1" min="1" max="4">
            </div>

            <p id="msg-box" style="display: none; font-weight: bold; text-align: center; margin-bottom: 10px; padding: 10px; border-radius: 8px;"></p>
            
            <button class="btn-add" id="btn-generate" onclick="genereerKalender()">🚀 Genereer Volledige Kalender</button>
        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/beheer-kalender.js"></script>
</body>
</html>
