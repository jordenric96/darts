<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match Center</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .filter-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; font-family: inherit; font-size: 1rem; }
        
        .match-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 15px; }
        .match-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
        .team-name { font-weight: bold; font-size: 1rem; color: white; }
        .vs-badge { background: rgba(255,255,255,0.1); color: var(--c-cyan); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        
        .match-action { display: flex; justify-content: center; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 15px; }
        
        .btn-action { font-weight: bold; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; width: 100%; text-transform: uppercase; font-size: 0.9rem; }
        .btn-fill { background: var(--c-cyan); color: black; }
        .btn-confirm { background: var(--c-pink); color: white; animation: pulse 2s infinite; }
        
        .status-badge { background: rgba(255,255,255,0.05); color: #aaa; padding: 8px 15px; border-radius: 8px; font-size: 0.85rem; text-align: center; width: 100%; }
        .status-waiting { background: rgba(255, 235, 59, 0.1); color: var(--c-yellow); }
        .score-display { font-size: 1.5rem; font-weight: bold; color: white; letter-spacing: 2px; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
        
        .my-match-border { border-left: 4px solid var(--c-cyan); }
    </style>
</head>
<body>
    <header class="top-header">
        <button class="btn-back" id="btn-back-hub">⬅</button>
        <h2 style="color: white; font-size: 1.2rem;">Match Center</h2>
    </header>

    <main style="padding-top: 10px;">
        <div class="filter-card">
            <select id="select-divisie" onchange="renderKalender()"></select>
        </div>

        <div id="kalender-container">
            <p style="text-align: center; color: #aaa;">Matchen laden...</p>
        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/kalender.js"></script>
</body>
</html>
