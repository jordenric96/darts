<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match Center</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .filter-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .filter-group { display: flex; gap: 10px; }
        .filter-group > div { flex: 1; }
        label { display: block; margin-bottom: 5px; color: var(--c-cyan); font-weight: bold; font-size: 0.75rem; text-transform: uppercase; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; font-family: inherit; font-size: 0.9rem; }
        
        /* Sectie Titels */
        .section-title { color: var(--c-yellow); font-size: 1rem; text-transform: uppercase; margin: 25px 0 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; display: flex; justify-content: space-between; align-items: flex-end; }
        .section-subtitle { font-size: 0.75rem; color: #aaa; text-transform: none; }

        /* Wedstrijd Kaarten */
        .matchday-card { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
        .match-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }
        .match-row:last-child { border-bottom: none; }
        .team-name { flex: 1; font-weight: bold; color: white; }
        .team-home { text-align: right; }
        .team-away { text-align: left; }
        
        /* Score & Tijd Badges */
        .badge-container { width: 70px; display: flex; justify-content: center; margin: 0 10px; }
        .score-badge { background: var(--c-cyan); color: black; font-weight: bold; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; }
        .time-badge { background: rgba(255,255,255,0.1); color: var(--c-yellow); font-weight: bold; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; }
        
        /* Highlight voor "Mijn Ploeg" */
        .my-team-row { background: rgba(236, 72, 153, 0.15); border-left: 4px solid var(--c-pink); }
        .my-team-text { color: var(--c-pink) !important; }

        /* Paginatie (verborgen in dashboard modus) */
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .btn-page { background: var(--c-cyan); color: black; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-page:disabled { background: #444; color: #888; cursor: not-allowed; }
        .btn-outline { display: block; width: 100%; background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); padding: 15px; border-radius: 10px; font-weight: bold; text-align: center; margin-top: 20px; cursor: pointer; margin-bottom: 30px; }
    </style>
</head>
<body>

    <header class="top-header">
        <button class="btn-back" id="btn-back-hub">⬅</button>
        <h2 style="color: white; font-size: 1.2rem;">Match Center</h2>
    </header>

    <main style="padding-top: 10px;">
        
        <div class="filter-card">
            <div class="filter-group">
                <div>
                    <label>Kies Reeks</label>
                    <select id="select-divisie" onchange="veranderDivisie()"></select>
                </div>
                <div>
                    <label>Mijn Ploeg</label>
                    <select id="select-ploeg" onchange="renderActueleView()">
                        <option value="ALL">Alle ploegen</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- DASHBOARD WEERGAVE (Laatste & Komende) -->
        <div id="dashboard-view">
            <h3 class="section-title">
                Laatste Uitslagen 
                <span class="section-subtitle" id="titel-vorige">Laden...</span>
            </h3>
            <div id="container-vorige" class="matchday-card"></div>

            <h3 class="section-title">
                Komende Matchen 
                <span class="section-subtitle" id="titel-volgende">Laden...</span>
            </h3>
            <div id="container-volgende" class="matchday-card"></div>

            <button class="btn-outline" onclick="toggleViewMode()">📅 Blader door alle speeldagen</button>
        </div>

        <!-- VOLLEDIGE KALENDER WEERGAVE (Verborgen per standaard) -->
        <div id="all-view" style="display: none;">
            <div class="pagination-bar">
                <button class="btn-page" id="btn-prev" onclick="vorigeSpeeldag()">⬅</button>
                <div style="text-align: center;">
                    <h3 style="font-size: 1.1rem; margin: 0; color: white;" id="titel-speeldag">Speeldag X</h3>
                    <div id="titel-datum" style="font-size: 0.8rem; color: #aaa; margin-top: 2px;">Datum</div>
                </div>
                <button class="btn-page" id="btn-next" onclick="volgendeSpeeldag()">➡</button>
            </div>
            
            <div id="container-all" class="matchday-card"></div>
            
            <button class="btn-outline" onclick="toggleViewMode()">⚡ Terug naar Actueel Overzicht</button>
        </div>

    </main>

    <script src="js/supabase.js"></script>
    <script src="js/kalender.js"></script>
</body>
</html>
