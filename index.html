<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Darts Competitie Beheer</title>
    
    <!-- PWA Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    
    <!-- Link naar de centrale CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- SUPABASE CLIENT INLADEN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1 class="dashboard-title">Darts Competitie</h1>
    
    <div class="dashboard-card">
        <h3>Mijn Competities</h3>
        <!-- Hier wordt de data uit js/app.js ingeladen -->
        <div id="competitie-lijst">
            <p style="color: #aaa;">Verbinden met database...</p>
        </div>
    </div>

    <!-- Knop naar de Trainer -->
    <button class="btn-trainer" onclick="window.location.href='trainer.html'">
        🎯 Oefen in de Neon Trainer
    </button>

    <!-- Laad jouw eigen scripts in de juiste volgorde in -->
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>

    <!-- Service Worker voor de App-ervaring -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
